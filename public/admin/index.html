<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Content Manager</title>
    <!-- type="text/yaml" is required — without it Decap ignores href
         entirely and falls back to fetching a hardcoded relative
         "config.yml", which resolves incorrectly whenever the current
         URL doesn't happen to end in a trailing slash. -->
    <link rel="cms-config-url" type="text/yaml" href="/admin/config.yml" />
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
